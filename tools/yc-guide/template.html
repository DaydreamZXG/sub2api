<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#fafaf7; --paper:#fff; --ink:#0b0f0c; --mut:#565d58; --line:rgb(11 15 12 / .1); --fill:rgb(11 15 12 / .045); --lime:#c8ff00; --on-lime:#0b0f0c; --code:#f1f2ec; --warn:#b45309; --bad:#c2362b; --warn-bg:rgb(180 83 9 / .08); }
html[data-theme=dark] { --bg:#06090a; --paper:#0c1113; --ink:#f4f6f1; --mut:rgb(244 246 241 / .68); --line:rgb(244 246 241 / .11); --fill:rgb(244 246 241 / .055); --code:#151b1d; --warn:#fbbf24; --bad:#ff7a70; --warn-bg:rgb(251 191 36 / .08); }
* { box-sizing:border-box; margin:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
button, input { font:inherit; color:inherit; }
.app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
.side { position:sticky; top:0; align-self:start; height:100vh; padding:26px 16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 10px 18px; font-weight:800; font-size:17px; letter-spacing:-.01em; text-decoration:none; }
.brand i { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:#0b0f0c; box-shadow:0 0 0 1px var(--line); color:var(--lime); font-style:normal; font-size:15px; }
.nav a { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-radius:12px; text-decoration:none; font-size:15px; color:var(--mut); }
.nav a:hover { background:var(--fill); color:var(--ink); }
.nav a.on { background:var(--lime); color:var(--on-lime); font-weight:700; }
.nav a small { font-size:12px; opacity:.7; }
.side .theme { margin-top:auto; align-self:flex-start; padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:none; font-size:13px; color:var(--mut); cursor:pointer; }
main { padding:44px clamp(20px,5vw,64px) 96px; max-width:1080px; width:100%; }
h1 { font-size:clamp(30px,4.4vw,44px); line-height:1.15; letter-spacing:-.03em; font-weight:800; }
.lead { margin-top:12px; max-width:680px; color:var(--mut); font-size:17px; }
.lead p + p { margin-top:8px; }
.meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.meta span { padding:4px 12px; border-radius:999px; background:var(--fill); font-size:13px; color:var(--mut); }
.search { position:relative; margin-top:28px; max-width:680px; }
.search input { width:100%; padding:16px 20px 16px 50px; border:1.5px solid var(--ink); border-radius:18px; background:var(--paper); font-size:17px; outline:none; box-shadow:0 5px 0 -1px var(--ink); }
.search input:focus { box-shadow:0 5px 0 -1px var(--lime), 0 0 0 3px var(--lime); }
.search svg { position:absolute; left:18px; top:50%; translate:0 -50%; width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2.2; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.chip { padding:6px 14px; border:1px solid var(--line); border-radius:999px; background:var(--paper); font-size:14px; cursor:pointer; text-decoration:none; }
.chip:hover { border-color:var(--ink); }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.chip small { opacity:.6; margin-left:4px; }
h2.sec { margin:44px 0 14px; font-size:22px; font-weight:800; letter-spacing:-.02em; }
h2.sec small { margin-left:8px; font-size:14px; font-weight:500; color:var(--mut); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.card { display:flex; flex-direction:column; gap:8px; padding:18px 20px; border:1px solid var(--line); border-radius:20px; background:var(--paper); text-decoration:none; transition:transform .15s, box-shadow .15s, border-color .15s; }
.card:hover { transform:translateY(-3px); border-color:var(--ink); box-shadow:0 6px 0 -1px var(--ink); }
.card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card b { font-size:17px; line-height:1.35; letter-spacing:-.01em; }
.card em { font-style:normal; font-size:13px; color:var(--mut); }
.card p { font-size:14px; line-height:1.55; color:var(--mut); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card footer { margin-top:auto; font-size:13px; color:var(--mut); }
.badge { flex:none; padding:2px 10px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap; }
.badge.direct { background:var(--lime); color:var(--on-lime); }
.badge.new { background:var(--ink); color:var(--bg); margin-right:6px; }
.badge.convert { box-shadow:inset 0 0 0 1.5px var(--ink); }
.badge.limited { background:var(--warn-bg); color:var(--warn); }
.badge.no { background:rgb(194 54 43 / .1); color:var(--bad); }
.cats { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.cat { padding:16px 18px; border-radius:18px; background:var(--ink); color:var(--bg); text-decoration:none; }
.cat b { display:block; font-size:16px; line-height:1.4; }
.cat span { font-size:13px; opacity:.7; }
.cat em { display:block; margin-top:10px; font-style:normal; font-size:13px; line-height:1.5; opacity:.82; }
.quick { margin-top:22px; max-width:680px; padding:18px 20px; border-radius:20px; background:#0b0f0c; color:#f4f6ef; }
.quick header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:16px; }
.quick-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-top:1px solid rgba(255,255,255,.12); font-size:14px; }
.quick-row span { opacity:.75; }
.quick-row code { padding:4px 10px; border-radius:8px; background:rgba(255,255,255,.08); color:#c8ff00; font-size:13.5px; cursor:pointer; overflow-wrap:anywhere; text-align:right; }
.quick-row code:hover { background:#c8ff00; color:#0b0f0c; }
.quick p { margin-top:10px; font-size:13px; opacity:.7; }
.cat:hover { background:var(--lime); color:var(--on-lime); }
details.fold { margin-top:12px; border:1px solid var(--line); border-radius:20px; background:var(--paper); }
details.fold > summary { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; font-size:17px; font-weight:800; cursor:pointer; list-style:none; }
details.fold > summary::-webkit-details-marker { display:none; }
details.fold > summary::after { content:'+'; font-size:22px; font-weight:400; color:var(--mut); }
details.fold[open] > summary::after { content:'–'; }
details.fold > .prose { padding:0 22px 22px; }
.back { display:inline-block; margin-bottom:18px; font-size:14px; color:var(--mut); text-decoration:none; }
.back:hover { color:var(--ink); }
.title-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.fill { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; margin-top:24px; padding:14px 18px; border-radius:18px; background:#0b0f0c; color:#f4f6f1; box-shadow:inset 0 0 0 1px var(--line); }
.fill label { display:flex; align-items:center; gap:8px; white-space:nowrap; font-size:13.5px; color:rgb(244 246 241 / .7); }
.fill input { width:190px; padding:6px 12px; border:1px solid rgb(244 246 241 / .22); border-radius:10px; background:transparent; color:#f4f6f1; font-size:14px; outline:none; }
.fill input:focus { border-color:var(--lime); }
.fill .seg, .quick .seg { display:flex; padding:3px; border-radius:11px; background:rgb(244 246 241 / .1); }
.fill .seg button, .quick .seg button { padding:4px 12px; border:0; border-radius:8px; background:none; color:rgb(244 246 241 / .7); font-size:13.5px; cursor:pointer; }
.fill .seg button.on, .quick .seg button.on { background:var(--lime); color:#0b0f0c; font-weight:700; }
.fill p { flex-basis:100%; font-size:12.5px; color:rgb(244 246 241 / .55); }
.tabs { display:flex; gap:6px; margin:26px 0 0; border-bottom:1px solid var(--line); overflow-x:auto; }
.tabs button { padding:10px 16px; border:0; border-bottom:3px solid transparent; background:none; font-size:15.5px; color:var(--mut); cursor:pointer; white-space:nowrap; }
.tabs button.on { border-color:var(--lime); color:var(--ink); font-weight:800; }
.tabs button small { margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--fill); font-size:12px; }
.prose { margin-top:20px; max-width:820px; }
.prose > * + * { margin-top:14px; }
.prose h2, .prose h3 { margin-top:30px; font-size:18px; font-weight:800; letter-spacing:-.01em; }
.prose h2 { font-size:21px; }
.prose ol, .prose ul { padding-left:0; list-style:none; display:grid; gap:10px; }
.prose ol { counter-reset:n; }
.prose ol > li { counter-increment:n; position:relative; padding-left:44px; min-height:30px; }
.prose ol > li::before { content:counter(n); position:absolute; left:0; top:-1px; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--lime); color:var(--on-lime); font-size:14px; font-weight:800; }
.prose ul > li { position:relative; padding-left:22px; }
.prose ul > li::before { content:''; position:absolute; left:4px; top:.72em; width:7px; height:7px; border-radius:50%; background:var(--ink); }
.prose li > * + * { margin-top:8px; }
.prose a { text-decoration:underline; text-decoration-color:var(--lime); text-decoration-thickness:2px; text-underline-offset:3px; }
.prose code { padding:2px 7px; border-radius:7px; background:var(--code); font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all; cursor:copy; }
.prose code:hover { box-shadow:0 0 0 1.5px var(--lime); }
.prose pre { position:relative; padding:16px 18px; border-radius:16px; background:#0b0f0c; overflow-x:auto; }
.prose pre code { padding:0; background:none; color:#e9ede4; font-size:13.5px; line-height:1.65; word-break:normal; white-space:pre; cursor:text; box-shadow:none; }
.prose pre .copy { position:absolute; top:10px; right:10px; padding:4px 12px; border:0; border-radius:999px; background:var(--lime); color:#0b0f0c; font-size:12.5px; font-weight:700; cursor:pointer; }
.prose blockquote { padding:12px 16px; border-radius:14px; background:var(--fill); border-left:4px solid var(--lime); font-size:15px; }
.prose blockquote.warn { background:var(--warn-bg); border-left-color:var(--warn); }
.tbl { overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--paper); }
.tbl table { width:100%; border-collapse:collapse; font-size:14.5px; line-height:1.6; }
.tbl th { text-align:left; padding:11px 16px; background:var(--fill); font-size:13px; color:var(--mut); font-weight:700; white-space:nowrap; }
.tbl td { padding:12px 16px; border-top:1px solid var(--line); vertical-align:top; min-width:120px; }
.errs { display:grid; gap:10px; }
.err { padding:16px 18px; border:1px solid var(--line); border-radius:16px; background:var(--paper); }
.err-s { font-weight:800; font-size:15.5px; line-height:1.5; }
.err-from { display:inline-block; margin-bottom:6px; padding:1px 10px; border-radius:999px; background:var(--fill); font-size:12.5px; color:var(--mut); text-decoration:none; }
a.err-from:hover { background:var(--lime); color:var(--on-lime); }
.prose a.err-from { text-decoration:none; }
.err dl { display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; margin-top:10px; font-size:14.5px; line-height:1.6; }
.err dt { color:var(--mut); font-size:13px; white-space:nowrap; padding-top:1px; }
.refs { margin-top:30px; padding-top:18px; border-top:1px solid var(--line); font-size:14.5px; color:var(--mut); }
.pager { display:flex; justify-content:space-between; gap:12px; margin-top:36px; }
.pager a { padding:10px 16px; border:1px solid var(--line); border-radius:14px; text-decoration:none; font-size:14.5px; }
.pager a:hover { border-color:var(--ink); }
.empty { margin-top:26px; color:var(--mut); }
.toast { position:fixed; left:50%; bottom:28px; translate:-50% 20px; padding:9px 18px; border-radius:999px; background:var(--ink); color:var(--bg); font-size:14px; opacity:0; pointer-events:none; transition:.2s; }
.toast.on { opacity:1; translate:-50% 0; }
@media (max-width:820px) {
  .app { display:block; }
  .side { position:sticky; z-index:5; height:auto; flex-direction:row; align-items:center; gap:0; padding:10px 12px; border-right:0; border-bottom:1px solid var(--line); background:var(--bg); overflow-x:auto; }
  .brand { padding:0 10px 0 4px; } .brand span { display:none; }
  .nav { display:flex; gap:2px; } .nav a { padding:7px 12px; white-space:nowrap; } .nav a small { display:none; }
  .side .theme { margin:0 0 0 8px; flex:none; }
  main { padding:22px 16px 72px; } h1 { font-size:27px; } .lead { font-size:15.5px; } .search { margin-top:16px; }
  .quick-row { flex-direction:column; align-items:flex-start; gap:4px; } .quick-row code { text-align:left; }
  .cats { grid-template-columns:1fr 1fr; } .cat { padding:14px; } .cat b { font-size:15px; }
  .err dl { grid-template-columns:1fr; gap:2px; } .err dd { margin-bottom:6px; }
  .fill input { flex:1; width:auto; min-width:0; } .fill label { flex:1 1 100%; }
}
.ava { flex:none; display:grid; place-items:center; width:40px; height:40px; border-radius:12px; background:#0b0f0c; color:#c8ff00; font-style:normal; font-size:18px; font-weight:800; box-shadow:inset 0 -3px 0 rgb(0 0 0 / .18); }
.card-top { justify-content:flex-start; align-items:center; gap:12px; }
.card-top b { font-size:16.5px; line-height:1.3; }
.card-badges { display:flex; flex-wrap:wrap; gap:6px; }
.card-badges .badge { margin:0; }
.title-row .ava { width:56px; height:56px; border-radius:16px; font-size:26px; }
@media (prefers-reduced-motion:no-preference) { #main > * { animation:rise .28s ease both; } @keyframes rise { from { opacity:0; transform:translateY(8px); } } }
.cat { position:relative; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:22px; padding:18px; transition:transform .15s, box-shadow .15s, border-color .15s; }
.cat:hover { background:var(--paper); color:var(--ink); transform:translateY(-3px); border-color:var(--ink); box-shadow:0 6px 0 -1px var(--ink); }
.cat-ic { display:grid; place-items:center; width:44px; height:44px; margin-bottom:14px; border-radius:14px; background:var(--lime); color:var(--on-lime); }
.cat span { color:var(--mut); opacity:1; }
.cat em { color:var(--mut); opacity:1; }
.hero { display:flex; align-items:center; gap:32px; padding:34px clamp(20px,4vw,40px); border-radius:32px; background:linear-gradient(135deg, color-mix(in srgb, var(--lime) 22%, var(--paper)), var(--paper) 62%); border:1px solid var(--line); }
.hero-text { flex:1; min-width:0; }
.hero-tag { display:inline-block; margin-bottom:14px; padding:5px 12px; border-radius:999px; background:var(--ink); color:var(--bg); font-size:13px; font-weight:700; }
.hero .search { margin-top:22px; }
.hero-art { flex:none; width:clamp(150px,20vw,220px); height:auto; filter:drop-shadow(0 14px 0 rgb(11 15 12 / .12)); }
.steps3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; list-style:none; }
.steps3 li { display:grid; grid-template-columns:auto 1fr; column-gap:12px; align-items:center; padding:14px 16px; border-radius:18px; background:var(--paper); border:1px solid var(--line); }
.steps3 i { grid-row:span 2; display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--lime); color:var(--on-lime); font-style:normal; font-weight:800; }
.steps3 b { font-size:15.5px; } .steps3 span { font-size:13px; color:var(--mut); }
.quick { max-width:none; margin-top:12px; }
@media (max-width:820px) { .hero { padding:22px 18px; border-radius:24px; } .hero-art { display:none; } .steps3 { grid-template-columns:1fr; gap:8px; } }
.ava.p1 { background:#c8ff00; color:#0b0f0c; } .ava.p2 { background:#1f6f43; color:#fff; } .ava.p3 { background:#e9e4d4; color:#0b0f0c; } .ava.p4 { background:#3b4a45; color:#fff; }
@media (min-width:1100px) { .cats { grid-template-columns:repeat(5,1fr); } }
.prose ol > li:not(:last-child)::after { content:''; position:absolute; left:14px; top:33px; bottom:-10px; width:2px; background:color-mix(in srgb, var(--lime) 60%, var(--line)); }
.prose blockquote { border-radius:16px; }
.prose pre { border-radius:18px; box-shadow:0 8px 0 -2px rgb(11 15 12 / .12); }
.err { border-left:4px solid var(--lime); }
:root[data-theme=dark] .ava.p0 { box-shadow:inset 0 0 0 1px rgb(200 255 0 / .45); }
.prose pre[data-lang] { padding-top:40px; }
.prose pre[data-lang]::before { content:attr(data-lang); position:absolute; top:12px; left:16px; font:700 11.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.06em; text-transform:uppercase; color:#c8ff00; opacity:.85; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/"><i>野</i><span>接入指南</span></a>
    <nav class="nav" id="nav"></nav>
    <button class="theme" id="theme" type="button"></button>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent)
const $ = (s, r = document) => r.querySelector(s)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const STATUS = { direct: '直接支持', convert: '协议转换', limited: '有限支持', no: '不建议' }
const state = { cat: '', status: '', line: 'cn', key: '', model: '', tab: {} }
const toolByNum = Object.fromEntries(D.tools.map((t) => [t.num, t]))
const catTitle = Object.fromEntries(D.cats.map((c) => [c.id, c.title]))
const ICON = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6" stroke-linecap="round"/></svg>'

const badge = (t) => `${t.new ? '<span class="badge new">新增</span>' : ''}${t.updated ? '<span class="badge new">已更新</span>' : ''}${t.status ? `<span class="badge ${t.status}">${STATUS[t.status]}</span>` : ''}`
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.codePointAt(0)) % 360, 7)
const avatar = (t) => `<i class="ava p${hue(t.name) % 5}">${esc((t.name.match(/[A-Za-z0-9\u4e00-\u9fff]/) || ['·'])[0].toUpperCase())}</i>`
const card = (t) => `<a class="card" href="#/tool/${t.num}">
  <div class="card-top">${avatar(t)}<b>${esc(t.name)}</b></div><div class="card-badges">${badge(t)}</div>
  ${t.note ? `<em>${esc(t.note)}</em>` : ''}<p>${esc(t.lead)}</p>
  <footer>${t.errors.length ? `${t.errors.length} 条常见报错` : catTitle[t.cat]}</footer></a>`
const errCard = (e, tool) => `<div class="err">${tool ? `<a class="err-from" href="#/tool/${tool.num}/errors">${esc(tool.name)}</a>` : '<span class="err-from">通用</span>'}
  <div class="err-s">${e.s}</div><dl><dt>原因</dt><dd>${e.c}</dd><dt>怎么办</dt><dd>${e.f}</dd></dl></div>`

function find(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean)
  if (!words.length) return { tools: [], errors: [] }
  const hit = (text) => words.every((w) => text.includes(w))
  const tools = D.tools.filter((t) => hit(`${t.name} ${t.note} ${t.lead} ${catTitle[t.cat]}`.toLowerCase()))
  const errors = []
  D.general.errors.forEach((e) => hit(e.t) && errors.push([e, null]))
  D.tools.forEach((t) => t.errors.forEach((e) => (hit(e.t) || (hit(`${t.name.toLowerCase()} ${e.t}`) && words.some((w) => e.t.includes(w)))) && errors.push([e, t])))
  return { tools, errors }
}
function results(q, onlyErrors) {
  const { tools, errors } = find(q)
  let html = ''
  if (!onlyErrors && tools.length) html += `<h2 class="sec">工具<small>${tools.length} 个</small></h2><div class="grid">${tools.map(card).join('')}</div>`
  if (errors.length) html += `<h2 class="sec">报错<small>${errors.length} 条</small></h2><div class="errs prose" style="max-width:none">${errors.slice(0, 60).map(([e, t]) => errCard(e, t)).join('')}</div>${errors.length > 60 ? '<p class="empty">结果太多，只显示前 60 条，再加一个词试试。</p>' : ''}`
  return html || `<p class="empty">没找到“${esc(q)}”。换个说法试试，比如只输入状态码或工具名。</p>`
}
const searchBox = (placeholder, q) => `<div class="search">${ICON}<input id="q" type="search" autocomplete="off" placeholder="${placeholder}" value="${esc(q)}"></div>`

const svg = (d) => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const CAT_ICON = [
  svg('<path d="M4 5h16v11H9l-5 4z"/>'),
  svg('<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>'),
  svg('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10l3 2-3 2M13 15h4"/>'),
  svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
  svg('<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 6.8l7 4M8.5 17.2l7-4"/>')
]
const views = {
  home() {
    const cats = D.cats.map((c) => {
      const mine = D.tools.filter((t) => t.cat === c.id)
      return `<a class="cat" href="#/tools" data-cat="${c.id}"><i class="cat-ic">${CAT_ICON[D.cats.indexOf(c) % CAT_ICON.length]}</i><b>${esc(c.title)}</b><span>${mine.length} 个工具</span><em>${esc(mine.slice(0, 4).map((t) => t.name.split(/[、（(/]/)[0].trim()).join(' · '))}${mine.length > 4 ? ' …' : ''}</em></a>`
    }).join('')
    const fold = (title, html) => `<details class="fold"><summary>${esc(title)}</summary><div class="prose">${html}</div></details>`
    const addr = [['OpenAI 格式（大多数软件）', 'https://yeschoy.com/v1'], ['Anthropic / Gemini 原生格式', 'https://yeschoy.com'], ['软件要“完整接口地址”时', 'https://yeschoy.com/v1/chat/completions']]
    const steps = [['拿密钥', '在野菜 AI 后台创建一枚 API 密钥'], ['填地址', '把下面的地址填进你的工具'], ['选模型', '从模型定价页复制完整模型 ID']]
    return `<section class="hero"><div class="hero-text"><span class="hero-tag">${D.tools.length} 个工具 · ${D.general.errors.length + D.tools.reduce((n, t) => n + t.errors.length, 0)} 条报错解法</span>
      <h1>${esc(D.title)}</h1><div class="lead"><p>选你的工具，只看它的配置和报错。</p></div>
      ${searchBox('搜工具名或报错，比如 Cursor、401、模型列表为空', '')}</div>
      <svg class="hero-art" viewBox="0 0 240 240" aria-hidden="true"><rect x="20" y="20" width="200" height="200" rx="48" fill="#0b0f0c"/><circle cx="120" cy="120" r="74" fill="#c8ff00" opacity=".14"/>
        <path d="M120 186V104" stroke="#c8ff00" stroke-width="9" stroke-linecap="round"/><path d="M120 128c-34 2-52-18-54-46 30-2 52 14 54 46z" fill="#c8ff00"/><path d="M120 110c2-32 22-50 52-50 0 30-18 50-52 50z" fill="#c8ff00"/>
        <path d="M84 190h72" stroke="#f4f6ef" stroke-width="9" stroke-linecap="round" opacity=".9"/><circle cx="182" cy="170" r="5" fill="#c8ff00"/><circle cx="58" cy="150" r="4" fill="#f4f6ef" opacity=".6"/></svg></section>
      <ol class="steps3">${steps.map(([a, b], i) => `<li><i>${i + 1}</i><b>${a}</b><span>${b}</span></li>`).join('')}</ol>
      <div id="out"><section class="quick" data-sub>
        <header><b>地址速查</b><span class="seg"><button type="button" data-line="cn" class="${state.line === 'cn' ? 'on' : ''}">大陆</button><button type="button" data-line="global" class="${state.line === 'global' ? 'on' : ''}">全球</button></span></header>
        ${addr.map(([label, url]) => `<div class="quick-row"><span>${label}</span><code>${url}</code></div>`).join('')}
        <p>点地址就能复制。密钥在野菜 AI 后台创建，模型 ID 从“模型定价”页完整复制。</p></section>
      <h2 class="sec">按类别找工具</h2><div class="cats">${cats}</div>
      <h2 class="sec">新手先看</h2>${D.start.map((s) => fold(s.title, s.html)).join('')}
      ${fold('关于这份指南', `${D.intro}<ul>${D.meta.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>`)}</div>`
  },
  tools() {
    const list = D.tools.filter((t) => (!state.cat || t.cat === state.cat) && (!state.status || (state.status === 'new' ? t.new : state.status === 'updated' ? t.updated : t.status === state.status)))
    const chip = (key, val, label, n) => `<button type="button" class="chip${state[key] === val ? ' on' : ''}" data-set="${key}" data-val="${val}">${esc(label)}${n === undefined ? '' : `<small>${n}</small>`}</button>`
    return `<h1>找到你的工具</h1><p class="lead">点开一个工具，只看它自己的配置步骤、注意事项和常见报错。</p>
      <div class="chips">${chip('cat', '', '全部', D.tools.length)}${D.cats.map((c) => chip('cat', c.id, c.title, D.tools.filter((t) => t.cat === c.id).length)).join('')}</div>
      <div class="chips">${chip('status', '', '不限支持程度')}${Object.entries(STATUS).map(([k, v]) => chip('status', k, v, D.tools.filter((t) => t.status === k).length)).join('')}${D.tools.some((t) => t.new) ? chip('status', 'new', '新增', D.tools.filter((t) => t.new).length) : ''}${D.tools.some((t) => t.updated) ? chip('status', 'updated', '已更新', D.tools.filter((t) => t.updated).length) : ''}</div>
      ${D.cats.filter((c) => (!state.cat || c.id === state.cat) && list.some((t) => t.cat === c.id)).map((c) => `<h2 class="sec">${esc(c.title)}</h2>${c.html ? `<div class="prose">${c.html}</div>` : ''}<div class="grid" style="margin-top:14px">${list.filter((t) => t.cat === c.id).map(card).join('')}</div>`).join('') || '<p class="empty">这个组合下没有工具。</p>'}`
  },
  tool(num, tab) {
    const t = toolByNum[num]
    if (!t) return views.tools()
    const active = t.tabs.find((x) => x.kind === (tab || state.tab[num])) || t.tabs[0]
    state.tab[num] = active.kind
    const i = D.tools.indexOf(t), prev = D.tools[i - 1], next = D.tools[i + 1]
    return `<a class="back" href="#/tools">← 全部工具</a>
      <div class="title-row">${avatar(t)}<h1>${esc(t.name)}</h1>${badge(t)}</div>
      <div class="lead">${t.note ? `<p>${esc(t.note)} · ${esc(catTitle[t.cat])}</p>` : ''}${t.leadHtml}</div>
      <div class="fill">
        <label>线路<span class="seg"><button type="button" data-line="cn" class="${state.line === 'cn' ? 'on' : ''}">大陆</button><button type="button" data-line="global" class="${state.line === 'global' ? 'on' : ''}">全球</button></span></label>
        <label>我的密钥<input id="key" placeholder="sk-...（可不填）" value="${esc(state.key)}" autocomplete="off" spellcheck="false"></label>
        <label>模型 ID<input id="model" placeholder="从模型定价页复制（可不填）" value="${esc(state.model)}" autocomplete="off" spellcheck="false"></label>
        <p>填了之后，下面的地址和命令会自动换成你的，复制就能用。只留在这个页面里，刷新就清空。</p>
      </div>
      ${t.tabs.length > 1 ? `<div class="tabs">${t.tabs.map((x) => `<button type="button" data-tab="${x.kind}" class="${x === active ? 'on' : ''}">${x.label}${x.kind === 'errors' ? `<small>${t.errors.length}</small>` : ''}</button>`).join('')}</div>` : ''}
      <div class="prose" data-sub>${active.html}</div>
      ${t.refs ? `<div class="refs prose">${t.refs}</div>` : ''}
      <div class="pager">${prev ? `<a href="#/tool/${prev.num}">← ${esc(prev.name)}</a>` : '<span></span>'}${next ? `<a href="#/tool/${next.num}">${esc(next.name)} →</a>` : ''}</div>`
  },
  errors() {
    const quick = ['401', '404', '429', '403', '超时', '模型列表', '余额', 'v1/v1', '工具调用']
    return `<h1>${esc(D.general.title)}</h1><p class="lead">输入状态码或报错里的几个字，所有工具的报错表一起搜。</p>
      ${searchBox('比如 401、404、context_length_exceeded、一直转圈', '')}
      <div class="chips">${quick.map((w) => `<button type="button" class="chip" data-q="${w}">${w}</button>`).join('')}</div>
      <div id="out"><h2 class="sec">最常见的<small>${D.general.errors.length} 条，适用于所有工具</small></h2>
      <div class="errs">${D.general.errors.map((e) => errCard(e, null)).join('')}</div>
      <div class="prose" data-sub>${D.general.rest}</div></div>`
  },
  p(id) {
    const page = D.pages.find((x) => x.id === id)
    return page ? `<h1>${esc(page.title)}</h1><div class="prose" data-sub>${page.html}</div>` : views.home()
  }
}

function substitute(root) {
  root.querySelectorAll('[data-sub] code').forEach((el) => {
    if (el.dataset.o === undefined) el.dataset.o = el.textContent
    let text = el.dataset.o
    if (state.line === 'global' && !text.includes('api.yeschoy.com')) text = text.replace(/(^|[^\w.-])yeschoy\.com/g, '$1api.yeschoy.com')
    if (state.key) text = text.split('请替换为你的密钥').join(state.key)
    if (state.model) text = text.split('请替换为模型ID').join(state.model)
    if (el.textContent !== text) el.textContent = text
  })
}
function enhance(root) {
  root.querySelectorAll('pre').forEach((pre) => {
    const lang = (pre.querySelector('code')?.className.match(/language-(\w+)/) || [])[1]
    if (lang && lang !== 'Plaintext') pre.dataset.lang = lang
    if (pre.querySelector('.copy')) return
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'copy'; b.textContent = '复制'
    pre.appendChild(b)
  })
  substitute(root)
}
function toast(text) {
  const el = $('#toast')
  el.textContent = text; el.classList.add('on')
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1400)
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text) } catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove()
  }
  toast('已复制')
}

function route() {
  const [, name = '', a, b] = location.hash.split('/')
  const view = { '': 'home', tools: 'tools', tool: 'tool', errors: 'errors', p: 'p' }[name] || 'home'
  const main = $('#main')
  main.innerHTML = views[view](view === 'tool' ? Number(a) : a, b)
  enhance(main)
  const nav = [['#/', '开始', ''], ['#/tools', '找工具', D.tools.length], ['#/errors', '查报错', D.general.errors.length + D.tools.reduce((n, t) => n + t.errors.length, 0)], ...D.pages.map((p) => [`#/p/${p.id}`, p.title, ''])]
  const current = view === 'tool' ? '#/tools' : view === 'p' ? `#/p/${a}` : view === 'home' ? '#/' : `#/${view}`
  $('#nav').innerHTML = nav.map(([href, label, n]) => `<a href="${href}" class="${href === current ? 'on' : ''}">${esc(label)}${n ? `<small>${n}</small>` : ''}</a>`).join('')
  document.title = view === 'tool' && toolByNum[a] ? `${toolByNum[a].name} · ${D.title}` : D.title
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-set],[data-tab],[data-line],[data-q],[data-cat],.copy,.prose code,.quick-row code')
  if (!el) return
  if (el.dataset.set) { state[el.dataset.set] = el.dataset.val; route() }
  else if (el.dataset.tab) { const num = Number(location.hash.split('/')[2]); state.tab[num] = el.dataset.tab; history.replaceState(null, '', `#/tool/${num}/${el.dataset.tab}`); route() }
  else if (el.dataset.line) { state.line = el.dataset.line; document.querySelectorAll('[data-line]').forEach((b) => b.classList.toggle('on', b === el)); substitute(document) }
  else if (el.dataset.q) { const q = $('#q'); q.value = el.dataset.q; q.dispatchEvent(new Event('input', { bubbles: true })) }
  else if (el.dataset.cat) { state.cat = el.dataset.cat; state.status = '' }
  else if (el.classList.contains('copy')) copy(el.parentElement.querySelector('code').textContent)
  else if (!el.closest('pre')) copy(el.textContent)
})
document.addEventListener('input', (ev) => {
  const el = ev.target
  if (el.id === 'key' || el.id === 'model') { state[el.id] = el.value.trim(); substitute(document) }
  if (el.id !== 'q') return
  const out = $('#out')
  if (out.dataset.o === undefined) out.dataset.o = out.innerHTML
  const q = el.value.trim()
  out.innerHTML = q ? results(q, location.hash.startsWith('#/errors')) : out.dataset.o
  enhance(out)
})

const themeBtn = $('#theme')
function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '浅色' : '深色' }
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'))
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
addEventListener('hashchange', () => { route(); scrollTo(0, 0) })
route()
</script>
